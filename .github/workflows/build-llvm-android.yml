name: Build LLVM for Android
on:
  push:
    tags: ["llvm-*"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build curl unzip

      - name: Setup Android NDK r27c
        run: |
          curl -fsSL -o ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$(pwd)/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Download LLVM 21.1.0 source
        run: |
          curl -fsSL -o llvm-project.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.0/llvm-project-21.1.0.src.tar.xz
          tar xf llvm-project.tar.xz

      - name: Build host llvm-tblgen
        run: |
          cmake -G Ninja -B llvm-native -S llvm-project-21.1.0.src/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_PROJECTS=""
          cmake --build llvm-native --target llvm-tblgen -j$(nproc)

      - name: Cross-build & package LLVM static libs for Android
        run: |
          for abi in arm64-v8a x86_64; do
            case $abi in
              arm64-v8a) arch=aarch64; target=AArch64 ;;
              x86_64)    arch=x86_64;  target=X86 ;;
            esac

            cmake -G Ninja -B "llvm-android-$arch" -S llvm-project-21.1.0.src/llvm \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_TARGETS_TO_BUILD="$target" \
              -DLLVM_TABLEGEN="$(pwd)/llvm-native/bin/llvm-tblgen" \
              -DLLVM_INCLUDE_TESTS=OFF \
              -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF \
              -DLLVM_BUILD_TOOLS=OFF \
              -DLLVM_INCLUDE_UTILS=OFF \
              -DLLVM_ENABLE_PROJECTS="" \
              -DLLVM_ENABLE_TERMINFO=OFF \
              -DLLVM_ENABLE_ZLIB=OFF \
              -DLLVM_ENABLE_ZSTD=OFF \
              -DLLVM_ENABLE_VISIBILITY_INLINES_HIDDEN=OFF \
              -DLLVM_ENABLE_VISIBILITY_HIDDEN=OFF \
              -DLLVM_ENABLE_RTTI=ON
            cmake --build "llvm-android-$arch" -j$(nproc)

            mkdir -p "install-$arch"
            cmake --install "llvm-android-$arch" --prefix "install-$arch"
            STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
            find "install-$arch/lib" -name "*.a" -exec "$STRIP" --strip-debug {} \;
            rm -rf "install-$arch/share" "install-$arch/libexec"
            tar cJf "llvm-android-$arch.tar.xz" -C "install-$arch" .
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            llvm-android-aarch64.tar.xz
            llvm-android-x86_64.tar.xz
